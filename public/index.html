<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4-Player Chess</title>
<style>
  :root {
    --light: #ece8df;
    --dark: #b3ad9f;
    --bg: #2f3a36;
    --red: #c0392b;
    --blue: #2b6cb0;
    --yellow: #d69e00;
    --green: #2f855a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: system-ui, sans-serif;
    color: #f1efe9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  button, input {
    font: inherit;
    border-radius: 6px;
    padding: 8px 14px;
  }
  button {
    background: #f1efe9;
    color: #22302b;
    border: 0;
    cursor: pointer;
  }
  button.ghost {
    background: transparent;
    color: inherit;
    border: 1px solid rgba(255, 255, 255, 0.4);
  }
  input {
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(0, 0, 0, 0.2);
    color: inherit;
    width: 9em;
    text-transform: uppercase;
  }
  #lobby { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #lobby .row { display: flex; gap: 8px; }
  #game { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }

  #info { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 18px; font-size: 16px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #seats { display: flex; gap: 10px; }
  #seats .seat { opacity: 0.35; }
  #seats .seat.taken { opacity: 1; }

  #board {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    grid-template-rows: repeat(14, 1fr);
    width: min(94vw, 72vh, 640px);
    aspect-ratio: 1;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(5.4vw, 4.4vh, 30px);
    line-height: 1;
    cursor: pointer;
    user-select: none;
  }
  .sq.light { background: var(--light); }
  .sq.dark  { background: var(--dark); }
  .sq.void  { visibility: hidden; cursor: default; }
  .sq.picked { outline: 3px solid #fff; outline-offset: -3px; background: #f3e9a8; }
  .sq.target::after {
    content: "";
    position: absolute;
    width: 32%;
    height: 32%;
    border-radius: 50%;
    background: rgba(30, 30, 30, 0.35);
  }
  .sq.capture::after {
    content: "";
    position: absolute;
    width: 86%;
    height: 86%;
    border-radius: 50%;
    border: 3px solid rgba(192, 57, 43, 0.85);
  }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .yellow { color: var(--yellow); }
  .green { color: var(--green); }

  #last { min-height: 1.4em; font-size: 14px; opacity: 0.85; }
  #note { min-height: 1.4em; font-size: 14px; color: #f3c98b; }
</style>
</head>
<body>
  <section id="lobby">
    <h1>4-Player Chess</h1>
    <button id="create" type="button">Create a room</button>
    <div class="row">
      <input id="code" placeholder="Room code" maxlength="6" autocomplete="off">
      <button id="join" class="ghost" type="button">Join room</button>
    </div>
  </section>

  <section id="game" hidden>
    <div id="info">
      <span id="you"></span>
      <span id="turn"></span>
      <span id="seats"></span>
      <button id="invite" class="ghost" type="button">Copy invite link</button>
    </div>
    <div id="board" role="grid" aria-label="Four-player chess board"></div>
    <div id="last"></div>
  </section>

  <div id="note"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="rules.js"></script>
<script>
  const { TURN_ORDER, SIZE } = Rules;
  const GLYPH = { R: "♜", N: "♞", B: "♝", Q: "♛", K: "♚", P: "♟" };
  const COLOR_HEX = { red: "#c0392b", blue: "#2b6cb0", yellow: "#d69e00", green: "#2f855a" };
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const $ = (id) => document.getElementById(id);

  const socket = io();
  let me = { code: null, color: null };
  let room = null;      // latest game state from the server
  let selected = null;  // { r, c }
  let targets = [];     // squares the selected piece can go to

  /* ---------- Joining ---------- */
  function join(code) {
    code = code.trim().toUpperCase();
    if (!code) return;
    const savedColor = sessionStorage.getItem("seat-" + code) || null;
    socket.emit("joinRoom", { code, color: savedColor });
  }

  socket.on("connect", () => {
    $("note").textContent = "";
    if (me.code) socket.emit("joinRoom", { code: me.code, color: me.color }); // reconnect
    else if (location.hash.length > 1) join(location.hash.slice(1));          // invite link
  });

  socket.on("disconnect", () => { $("note").textContent = "Connection lost. Trying to reconnect..."; });
  socket.on("problem", (msg) => { $("note").textContent = msg; });

  socket.on("joined", ({ code, color }) => {
    me = { code, color };
    sessionStorage.setItem("seat-" + code, color || "");
    location.hash = code;
    $("note").textContent = "";
    $("lobby").hidden = true;
    $("game").hidden = false;
  });

  socket.on("room", (r) => {
    room = r;
    selected = null;
    targets = [];
    render();
  });

  $("create").addEventListener("click", () => socket.emit("createRoom"));
  $("join").addEventListener("click", () => join($("code").value));
  $("invite").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      $("note").textContent = "Invite link copied. Send it to your friends.";
    } catch (e) {
      $("note").textContent = "Copy this link from the address bar: " + location.href;
    }
  });

  /* ---------- Playing ---------- */
  const seatedCount = () => TURN_ORDER.filter((c) => room.seats[c]).length;
  const isMyTurn = () => room && seatedCount() === 4 && me.color === TURN_ORDER[room.turnIndex];

  function onSquareClick(r, c) {
    if (!isMyTurn()) return;

    if (selected && targets.some(([tr, tc]) => tr === r && tc === c)) {
      socket.emit("move", { from: selected, to: { r, c } });
      selected = null;
      targets = [];
      render();
      return;
    }

    const piece = room.state[r][c];
    if (piece && piece.color === me.color) {
      selected = { r, c };
      targets = Rules.legalMoves(room.state, r, c);
    } else {
      selected = null;
      targets = [];
    }
    render();
  }

  /* ---------- Drawing ---------- */
  function render() {
    if (!room) return;
    const seated = seatedCount();
    const turnColor = TURN_ORDER[room.turnIndex];

    $("you").innerHTML = me.color
      ? `<span class="dot" style="background:${COLOR_HEX[me.color]}"></span>You are ${cap(me.color)}`
      : "Room is full. You are watching.";

    $("turn").textContent = seated < 4
      ? `Waiting for players (${seated}/4)`
      : `${cap(turnColor)} to move` + (isMyTurn() ? " (your turn)" : "");

    $("seats").innerHTML = TURN_ORDER.map((c) =>
      `<span class="seat ${room.seats[c] ? "taken" : ""}" title="${cap(c)}: ${room.seats[c] ? "joined" : "empty"}">` +
      `<span class="dot" style="background:${COLOR_HEX[c]}"></span></span>`
    ).join("");

    $("last").textContent = room.last;

    const boardEl = $("board");
    boardEl.innerHTML = "";
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const el = document.createElement("div");
        el.className = "sq";
        if (Rules.isVoid(r, c)) {
          el.classList.add("void");
        } else {
          el.classList.add((r + c) % 2 === 0 ? "light" : "dark");
          const piece = room.state[r][c];
          if (piece) {
            el.classList.add(piece.color);
            el.textContent = GLYPH[piece.type] + "\uFE0E";
          }
          if (selected && selected.r === r && selected.c === c) el.classList.add("picked");
          if (targets.some(([tr, tc]) => tr === r && tc === c)) el.classList.add(piece ? "capture" : "target");
          el.addEventListener("click", () => onSquareClick(r, c));
        }
        boardEl.appendChild(el);
      }
    }
  }
</script>
</body>
</html>
